<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HR Portal: peer recognition for everyone, with sentiment insights for managers." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>HR Portal</title>
    <script src="%BASE_URL%theme-init.js"></script>
    <!-- Runtime configuration, generated at container start (window.__APP_CONFIG__). Deferred scripts run
         in document order, so it is still set before the app's module script runs. -->
    <script defer src="%BASE_URL%config.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Painted while the app loads; React replaces it on its first render. -->
      <div class="boot" aria-hidden="true">

      </div>
    </div>
    <noscript>HR Portal needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
