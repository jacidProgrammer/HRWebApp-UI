server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build output can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Generated at container start from environment variables: never cache it
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The mock API's service worker (demo mode only) must be revalidated on every load
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/people/<id>, /dashboard, ...) all load the app shell
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
