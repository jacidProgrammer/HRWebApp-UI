name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Generated API types match the pinned OpenAPI document
        run: node scripts/api-types.mjs --check src/api/generated/openapi.json

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the GitHub Pages demo
        run: npm run build:pages

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Regenerates the API types from the backend's OpenAPI document on its main branch (docs/openapi.json) and
  # fails if they differ from the committed src/api/generated/schema.d.ts. If the document is missing (the
  # URL answers 404), it warns and passes instead.
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare with the backend's OpenAPI document
        run: npm run api:check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: hr-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo mode)
        run: |
          docker run -d --name hr-portal -p 8080:80 -e AUTH_MODE=mock hr-portal:ci
          for _ in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          headers="$(curl -fsI http://localhost:8080/people/some-id)"
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy: .*connect-src '"'"'self'"'"';'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^cache-control: no-cache'
          curl -fs http://localhost:8080/config.js | grep -q 'AUTH_MODE: "mock"'

      - name: Container logs
        if: ${{ always() }}
        run: docker logs hr-portal || true
