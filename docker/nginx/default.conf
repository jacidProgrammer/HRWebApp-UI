# The SPA behind nginx. Security headers live in security-headers.conf; the Content-Security-Policy in it is
# written at container start by docker/40-app-config.sh, because it names the API and Keycloak origins.
#
# nginx drops every inherited add_header in a block that declares its own, so each location below that sets
# Cache-Control includes the security headers again.

server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # Fingerprinted build output (JS, CSS, fonts): the name changes with the content, so cache it for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Stable names whose content changes between deployments (config.js even between container starts):
    # always revalidate.
    location ~ ^/(config\.js|theme-init\.js|mockServiceWorker\.js|favicon\.svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/people/<id>, /dashboard, ...) all load the app shell, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
