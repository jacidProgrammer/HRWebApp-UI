# Security headers for every response. Included at server level and again in each location that adds its
# own headers (see default.conf).

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content-Security-Policy, and Strict-Transport-Security when ENABLE_HSTS=true: generated at start-up.
include /etc/nginx/snippets/generated-headers.conf;
